name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android shell and verify app
        run: |
          flutter create --platforms=android --project-name=al_muhasib_pro --org=com.almuhasib /tmp/al_muhasib_shell
          cp pubspec.yaml analysis_options.yaml /tmp/al_muhasib_shell/
          rm -rf /tmp/al_muhasib_shell/lib /tmp/al_muhasib_shell/test
          cp -R lib test /tmp/al_muhasib_shell/
          cd /tmp/al_muhasib_shell
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/al-muhasib-pro-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: al-muhasib-pro-release-apk
          path: dist/al-muhasib-pro-release.apk
          if-no-files-found: error
